# Compila l'app per iPad su un Mac gratuito di GitHub e produce un file .ipa
# NON firmato, da installare con Sideloadly (che lo firma con il tuo Apple ID).
name: Compila app iPad

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/build-ipad-app.yml"
  workflow_dispatch:   # pulsante "Run workflow" nella scheda Actions

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Versione di Xcode
        run: xcodebuild -version

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera il progetto Xcode
        working-directory: ios
        run: xcodegen generate

      - name: Compila (senza firma)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project SecondScreen.xcodeproj \
            -scheme SecondScreen \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log

      - name: Crea il file .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SecondScreen.app Payload/
          zip -qry SecondScreen.ipa Payload
          ls -lh SecondScreen.ipa

      - name: Carica il file .ipa
        uses: actions/upload-artifact@v4
        with:
          name: SecondScreen-ipa
          path: ios/SecondScreen.ipa
          retention-days: 30

      - name: Carica il log in caso di errore
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build.log
